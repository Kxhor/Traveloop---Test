<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Traveloop - Premium Multi-City Travel Itinerary Platform</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-tertiary-fixed-variant": "#891933",
            "surface-container-highest": "#e0e3e5",
            "surface-tint": "#565e74",
            "on-surface-variant": "#45464d",
            "on-error-container": "#93000a",
            "primary": "#000000",
            "surface-bright": "#f7f9fb",
            "outline": "#76777d",
            "surface": "#f7f9fb",
            "tertiary-fixed-dim": "#ffb2b9",
            "secondary": "#006a61",
            "surface-container-lowest": "#ffffff",
            "error": "#ba1a1a",
            "inverse-primary": "#bec6e0",
            "secondary-fixed-dim": "#6bd8cb",
            "on-secondary-fixed": "#00201d",
            "inverse-surface": "#2d3133",
            "on-primary-container": "#7c839b",
            "on-primary-fixed-variant": "#3f465c",
            "tertiary-container": "#400010",
            "on-secondary": "#ffffff",
            "on-secondary-container": "#006f66",
            "on-secondary-fixed-variant": "#005049",
            "surface-dim": "#d8dadc",
            "surface-container-low": "#f2f4f6",
            "secondary-container": "#86f2e4",
            "on-tertiary": "#ffffff",
            "on-surface": "#191c1e",
            "tertiary": "#000000",
            "on-tertiary-container": "#da586c",
            "surface-variant": "#e0e3e5",
            "on-primary-fixed": "#131b2e",
            "on-background": "#191c1e",
            "on-error": "#ffffff",
            "on-tertiary-fixed": "#400010",
            "background": "#f7f9fb",
            "surface-container": "#eceef0",
            "secondary-fixed": "#89f5e7",
            "outline-variant": "#c6c6cd",
            "on-primary": "#ffffff",
            "error-container": "#ffdad6",
            "primary-fixed-dim": "#bec6e0",
            "primary-container": "#131b2e",
            "inverse-on-surface": "#eff1f3",
            "primary-fixed": "#dae2fd",
            "surface-container-high": "#e6e8ea",
            "tertiary-fixed": "#ffdadc"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "maxWidth": {
            "container-max": "1280px"
          },
          "spacing": {
            "gutter": "24px",
            "base": "8px",
            "margin-desktop": "40px",
            "container-max": "1280px",
            "section-gap": "80px",
            "margin-mobile": "16px"
          },
          "fontFamily": {
            "headline-md": ["Plus Jakarta Sans"],
            "label-md": ["Plus Jakarta Sans"],
            "headline-lg": ["Plus Jakarta Sans"],
            "headline-lg-mobile": ["Plus Jakarta Sans"],
            "body-md": ["Plus Jakarta Sans"],
            "body-lg": ["Plus Jakarta Sans"],
            "label-sm": ["Plus Jakarta Sans"],
            "headline-xl": ["Plus Jakarta Sans"]
          },
          "fontSize": {
            "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
            "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600"}],
            "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
            "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
            "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
            "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
            "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
            "headline-xl": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
          }
        }
      }
    }
  </script>

  <!-- Global Styles -->
  <link rel="stylesheet" href="css/app.css"/>

  <style>
    /* Tailwind config applied above */
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .btn-sm {
      padding: 8px 16px;
      font-size: 14px;
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen selection:bg-secondary/30">

  <!-- Main App Container -->
  <div id="app" class="relative z-10 min-h-screen"></div>

  <!-- Toast Notifications Container -->
  <div id="toast-container" class="fixed top-6 right-6 z-[100] flex flex-col gap-3"></div>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="fixed inset-0 z-[90] hidden items-center justify-center bg-black/40 backdrop-blur-sm"></div>

  <!-- Main Application Script (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
