<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traveloop Debug Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
  <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-lg p-8">
    <h1 class="text-3xl font-bold mb-6">Traveloop Frontend Debug Test</h1>

    <div class="space-y-4">
      <div class="border-b pb-4">
        <h2 class="text-xl font-semibold mb-2">1. API Connection Test</h2>
        <button onclick="testAPI()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
          Test API Connection
        </button>
        <div id="api-result" class="mt-2 p-3 bg-gray-50 rounded"></div>
      </div>

      <div class="border-b pb-4">
        <h2 class="text-xl font-semibold mb-2">2. Template Loading Test</h2>
        <button onclick="testTemplate()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
          Test Template Loading
        </button>
        <div id="template-result" class="mt-2 p-3 bg-gray-50 rounded"></div>
      </div>

      <div class="border-b pb-4">
        <h2 class="text-xl font-semibold mb-2">3. Router Test</h2>
        <button onclick="testRouter()" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">
          Test Router
        </button>
        <div id="router-result" class="mt-2 p-3 bg-gray-50 rounded"></div>
      </div>

      <div class="border-b pb-4">
        <h2 class="text-xl font-semibold mb-2">4. Navigation Test</h2>
        <div class="space-x-2">
          <a href="/#/login" class="inline-block bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600">Go to Login</a>
          <a href="/#/trips" class="inline-block bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600">Go to Trips</a>
          <a href="/#/plan-trip" class="inline-block bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600">Go to Plan Trip</a>
          <a href="/#/itinerary/1" class="inline-block bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600">Go to Itinerary #1</a>
        </div>
      </div>

      <div>
        <h2 class="text-xl font-semibold mb-2">5. Console Logs</h2>
        <p class="text-sm text-gray-600">Open browser DevTools (F12) to see detailed logs</p>
      </div>
    </div>
  </div>

  <script>
    async function testAPI() {
      const result = document.getElementById('api-result');
      result.innerHTML = 'Testing...';

      try {
        const response = await fetch('/api/trips/');
        const data = await response.json();
        result.innerHTML = `✅ Success! Found ${data.length} trips<br><pre class="text-xs mt-2">${JSON.stringify(data[0], null, 2)}</pre>`;
        result.className = 'mt-2 p-3 bg-green-50 rounded text-green-800';
      } catch (error) {
        result.innerHTML = `❌ Error: ${error.message}`;
        result.className = 'mt-2 p-3 bg-red-50 rounded text-red-800';
      }
    }

    async function testTemplate() {
      const result = document.getElementById('template-result');
      result.innerHTML = 'Testing...';

      try {
        const response = await fetch('/Stitch screens/Traveloop - Preplanned Trips View.html');
        const html = await response.text();
        result.innerHTML = `✅ Success! Template loaded (${html.length} bytes)<br><pre class="text-xs mt-2">${html.substring(0, 200)}...</pre>`;
        result.className = 'mt-2 p-3 bg-green-50 rounded text-green-800';
      } catch (error) {
        result.innerHTML = `❌ Error: ${error.message}`;
        result.className = 'mt-2 p-3 bg-red-50 rounded text-red-800';
      }
    }

    function testRouter() {
      const result = document.getElementById('router-result');
      const hash = window.location.hash;
      const path = hash.slice(1) || '/';
      result.innerHTML = `Current hash: <code class="bg-gray-200 px-2 py-1 rounded">${hash || '(empty)'}</code><br>Current path: <code class="bg-gray-200 px-2 py-1 rounded">${path}</code>`;
      result.className = 'mt-2 p-3 bg-blue-50 rounded text-blue-800';
    }

    // Auto-run tests on load
    window.addEventListener('load', () => {
      console.log('🧪 Debug page loaded');
      testRouter();
    });

    window.addEventListener('hashchange', () => {
      console.log('🔄 Hash changed to:', window.location.hash);
      testRouter();
    });
  </script>
</body>
</html>
